name: Prepare Taiwanese copy and theme
on:
  push:
    branches: [chore/zh-tw-theme]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Apply requested copy corrections and theme controls
        run: |
          python3 scripts/prepare_zh_tw.py
          rm scripts/prepare_zh_tw.py .github/workflows/prepare-zh-tw.yml
      - name: Check Taiwanese language and archive structure
        run: |
          python3 scripts/check_locale.py
          python3 scripts/test_locale.py
          python3 scripts/validate.py
      - name: Run parser and theme unit tests
        run: node --test tests/*.test.js
      - name: Test desktop and mobile browser interactions
        run: |
          python3 scripts/browser_check.py
          python3 scripts/theme_browser_check.py
      - name: Build verified static site
        run: python3 scripts/build.py
      - name: Commit only the requested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md PUBLISHING.md index.html assets content templates scripts .github/workflows
          git commit -m 'fix: normalize archive to Taiwanese Traditional Chinese and finalize theme controls'
          git archive --format=zip HEAD -o source-preview.zip
          git push origin HEAD:refs/heads/chore/zh-tw-theme
      - name: Save source for review even if a test fails
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          with zipfile.ZipFile('worktree-preview.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files'], text=True).splitlines():
                  if Path(name).is_file():
                      z.write(name)
          PY
          python3 -m pip download --no-deps -d ci-tools -r requirements-dev.txt
      - name: Save verified source and browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-tw-theme-preview
          path: |
            source-preview.zip
            worktree-preview.zip
            ci-tools/
            browser-preview/
          retention-days: 3
