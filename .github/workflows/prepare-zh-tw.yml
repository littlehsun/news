name: Prepare Taiwanese copy and theme
on:
  push:
    branches: [chore/zh-tw-theme]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Apply requested copy corrections and theme controls
        run: |
          python3 scripts/prepare_zh_tw.py
          rm scripts/prepare_zh_tw.py .github/workflows/prepare-zh-tw.yml
      - name: Validate all changes
        run: |
          python3 scripts/check_locale.py
          python3 scripts/test_locale.py
          python3 scripts/validate.py
          node --test tests/*.test.js
          python3 scripts/browser_check.py
          python3 scripts/theme_browser_check.py
          python3 scripts/build.py
      - name: Commit only the requested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md PUBLISHING.md index.html assets content templates scripts .github/workflows
          git commit -m 'fix: normalize archive to Taiwanese Traditional Chinese and finalize theme controls'
          git push origin HEAD:refs/heads/chore/zh-tw-theme
          git archive --format=zip HEAD -o source-preview.zip
      - name: Save verified source and browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-tw-theme-preview
          path: |
            source-preview.zip
            browser-preview/
          retention-days: 3
